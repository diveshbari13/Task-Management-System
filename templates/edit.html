{% extends "base.html" %}
{% block content %}

<h2>Edit Task</h2>

<form method="POST">

    <input type="text" name="content" value="{{ task.content }}" required>
    <input type="date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task.due_date else '' }}">

    <button type="submit">Update</button>
</form>

{% endblock %}
